name: Android CI & Build APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Ensure Gradle Wrapper exists
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "gradlew not found, generating wrapper..."
            gradle wrapper || true
          fi
          chmod +x ./gradlew

      - name: Extract Version Name
        id: get_version
        run: |
          VERSION_NAME=$(grep "versionName =" app/build.gradle.kts | head -n 1 | awk -F'"' '{print $2}')
          echo "VERSION_NAME=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "Detected App Version: ${VERSION_NAME}"

      - name: Setup Consistent Android Debug Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          echo "Setting up persistent debug keystore for consistent signing..."
          python3 -c "
          import os, base64
          raw = ''
          if os.path.exists('debug.keystore.base64'):
              with open('debug.keystore.base64', 'r') as f:
                  raw = f.read()
              print('Source: debug.keystore.base64 file')
          elif os.environ.get('KEYSTORE_BASE64'):
              raw = os.environ.get('KEYSTORE_BASE64', '')
              print('Source: GitHub Secret KEYSTORE_BASE64')
          cleaned = ''.join(raw.split())
          if cleaned:
              padding = len(cleaned) % 4
              if padding:
                  cleaned += '=' * (4 - padding)
              target = os.path.expanduser('~/.android/debug.keystore')
              os.makedirs(os.path.dirname(target), exist_ok=True)
              with open(target, 'wb') as f:
                  f.write(base64.b64decode(cleaned))
              print('Successfully wrote keystore.')
          else:
              print('Warning: No keystore base64 data found.')
          "
          keytool -list -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey

      - name: Build Debug APK with Gradle
        run: |
          ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: garden-companion-v${{ steps.get_version.outputs.VERSION_NAME }}-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.VERSION_NAME }}
          name: Garden Companion v${{ steps.get_version.outputs.VERSION_NAME }}
          draft: false
          prerelease: false
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
